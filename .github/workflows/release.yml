name: Release Windows

# Gera o instalador .exe. Roda ao publicar uma Release com tag vX.Y.Z (e anexa os
# arquivos a ela) ou manualmente pela aba Actions (gera só o artefato para download).
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write      # atestado de procedência (Sigstore) dos instaladores
  attestations: write

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Versão
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; else V="0.0.0-dev"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller

      - name: Gerar ícone
        run: python packaging/make_icon.py packaging/nexus.ico

      - name: Empacotar com PyInstaller
        run: pyinstaller packaging/nexus_intel.spec --noconfirm --clean

      - name: Autoteste do executável
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\NexusIntel\NexusIntel.exe" -ArgumentList "--self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Autoteste falhou (código $($p.ExitCode))" }
          Write-Host "Autoteste OK"

      - name: Instalar Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Gerar instalador
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.version }}" packaging\installer.iss
          Compress-Archive -Path dist\NexusIntel -DestinationPath "dist\NexusIntel-portatil-${{ steps.ver.outputs.version }}.zip"

      - name: Hashes SHA-256
        shell: pwsh
        run: |
          Get-ChildItem dist\*.exe, dist\*.zip | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Out-File -Encoding ascii dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt

      - name: Atestado de procedência dos instaladores (verificável com `gh attestation verify`)
        uses: actions/attest-build-provenance@v2
        continue-on-error: true
        with:
          subject-path: |
            dist/*.exe
            dist/*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: NexusIntel-windows-${{ steps.ver.outputs.version }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt

      - name: Publicar Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: NEXUS INTEL ${{ steps.ver.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt
